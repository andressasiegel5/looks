<title>Looks do Dia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular — um look por vez sobre papel pontilhado, chips de mood no topo, barra preta fixa embaixo */
:root {
  --bg: #EBEAE7;
  --dot: transparent;
  --surface: #FFFFFF;
  --ink: #141414;
  --muted: #85847F;
  --line: #E4E3DF;
  --on-ink: #FFFFFF;
  --heart: #D6384B;
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --dot: #2C2C2A; --surface: #1C1C1B; --ink: #F1F0EC; --muted: #9A9993; --line: #2E2E2C; --on-ink: #121212; --heart: #F06A7A; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --dot: #2C2C2A; --surface: #1C1C1B; --ink: #F1F0EC; --muted: #9A9993; --line: #2E2E2C; --on-ink: #121212; --heart: #F06A7A; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-weight: 700; letter-spacing: -0.02em; margin: 0; text-transform: lowercase; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.05; text-align: center; }
h2 { font-size: 24px; line-height: 1.1; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.link { background: none; border: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: none; background: var(--surface); border-radius: 999px; padding: 8px 15px; font-size: 14px; font-weight: 500; box-shadow: 0 0 0 1px var(--line) inset; text-transform: lowercase; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }

/* hero */
.hero { position: relative; display: flex; justify-content: center; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.hero-img { -webkit-user-drag: none; }
.hero-img { width: min(100%, 380px); aspect-ratio: 4 / 5; object-fit: cover; object-position: center 30%; border-radius: 22px; display: block; background: transparent; will-change: transform; }
.controls { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 14px; }
.ctrl { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--surface); display: grid; place-items: center; font-size: 30px; line-height: 1; padding-bottom: 3px; }
.ctrl.fav { width: 60px; height: 60px; background: var(--ink); color: var(--on-ink); font-size: 24px; }
.ctrl.fav.on { background: var(--heart); color: #fff; }
.round { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset, 0 4px 14px -6px rgb(0 0 0 / .25); display: grid; place-items: center; font-size: 20px; }
.round.left { left: 0; } .round.right { right: 0; }
.round.on { color: var(--heart); }
.hero-cap { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.hero-cap strong { font-size: 18px; text-transform: lowercase; }
.hero-cap span { color: var(--muted); font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }

/* segmentado */
.seg { align-self: center; display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: 0 0 0 1px var(--line) inset; }
.seg button { border: none; background: none; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

/* complete the look */
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; margin: 0 -2px; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.pcard { flex: none; width: 132px; scroll-snap-align: start; background: var(--surface); border: none; border-radius: 18px; padding: 8px; text-align: left; box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; gap: 6px; }
.pcard img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; }
.pcard .ph { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
.pcard b { font-size: 13px; font-weight: 600; line-height: 1.25; }
.pcard small { color: var(--muted); font-size: 12px; }

/* grades */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { border: none; padding: 0; background: var(--surface); border-radius: 20px; overflow: hidden; text-align: left; box-shadow: 0 0 0 1px var(--line) inset; position: relative; display: flex; flex-direction: column; }
.tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 30%; display: block; }
.tile .t { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .t b { font-size: 14px; font-weight: 600; text-transform: lowercase; line-height: 1.25; }
.tile .t small { color: var(--muted); font-size: 12px; }
.tile .fav { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); color: var(--heart); display: grid; place-items: center; font-size: 14px; }
.tile.sel { box-shadow: 0 0 0 3px var(--ink) inset; }
.tile.sel img { opacity: .75; }
.tile .check { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgb(0 0 0 / .25); display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; }
.tile.sel .check { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: 0 8px 30px -8px rgb(0 0 0 / .35), 0 0 0 1px var(--line) inset; white-space: nowrap; }
.btn.danger { background: #C8323F; color: #fff; box-shadow: none; }
.prail { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.prail::-webkit-scrollbar { display: none; }
.pf { flex: none; width: 58px; border: none; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pf img { width: 58px; height: 58px; object-fit: cover; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
.pf span { font-size: 10px; color: var(--muted); line-height: 1.15; text-align: center; max-width: 58px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pf[aria-pressed="true"] img { box-shadow: 0 0 0 3px var(--ink); }
.pf[aria-pressed="true"] span { color: var(--ink); font-weight: 600; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.badge.ok { color: var(--ink); }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.toggle input { accent-color: var(--ink); width: 16px; height: 16px; }

/* botões */
.btn { border: none; border-radius: 999px; padding: 11px 18px; font-weight: 600; font-size: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.btn.dark { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.btn.small { padding: 7px 13px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* lista de prompts / ideias */
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.card details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.prompt { background: var(--bg); border-radius: 12px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; max-height: 240px; overflow: auto; margin: 8px 0 0; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs img { width: 56px; height: 70px; object-fit: cover; border-radius: 8px; flex: none; }

/* barra inferior */
nav.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #0E0E0E; color: #F1F0EC;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-radius: 22px 22px 0 0; box-shadow: 0 -1px 0 var(--line); }
nav.bar .in { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; }
nav.bar a { color: #A8A7A2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 6px; text-transform: lowercase; }
nav.bar a[aria-current="page"] { color: #FFFFFF; text-decoration: underline; text-underline-offset: 5px; }

/* painel */
dialog { border: none; padding: 0; background: var(--surface); color: var(--ink); border-radius: 24px; width: min(560px, calc(100vw - 20px)); max-height: calc(100dvh - 28px); box-shadow: 0 24px 60px rgb(0 0 0 / .35); }
dialog::backdrop { background: rgb(10 10 10 / .5); }
.sheet { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.close { border: none; background: transparent; font-size: 26px; line-height: 1; padding: 2px 8px; color: var(--muted); }
.sheet .big { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 18px; background: var(--bg); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .hero-img { transition: opacity .2s ease; } }
</style>

<div class="wrap">
  <section id="view-mood">
    <div class="wrap" style="gap:16px">
      <h1>escolha seu mood</h1>
      <div class="chips" id="moodChips"></div>

      </div>
      <div>
        <div class="row"><h2>complete o look</h2><button class="link" type="button" id="seeLook">ver look</button></div>

  <section id="view-looks" hidden>
    <div class="wrap" style="gap:14px">
      <div class="row"><h2>looks</h2><div class="actions"><button class="btn small" type="button" id="selToggle">selecionar</button><button class="btn small dark" type="button" id="drawNew">↻ combinação nova</button></div></div>
      <div class="chips" id="looksChips"></div>

  <section id="view-favoritos" hidden>

      <div class="grid" id="piecesGrid"></div>
    </div>
  </section>

</div>

const LONG = ["CAS-01","TRE-01","BLA-02"];
const AMPLAS = ["JAQ-02","BLU-14","CAS-02","JAQ-05","JAQ-06","JAQ-08","JAQ-09","JAQ-11"];
const COM_VOLUME = ["SAI-01"];
const isBottom = p => p && ["saia","calca","vestido"].includes(p.cat);
const isMine = p => p && p.tenho === true;
const ACESS = /bolsa|óculos|cinto|colar|brinc|argola|lenço|pérola|tote|meia-calça/i;
const BAIXO_GENERICO = "calça reta de alfaiataria de cintura alta, em tom neutro, caimento ajustado e sem volume";
const semBaixo = codes => !codes.some(c => isBottom(BY[c]));

// ---------- Moods ----------
const MOODS = [["todos","todos"],["trabalho","trabalho"],["minimal","minimalista"],["offduty","off-duty"],["noite","noite"]];
function moodsOf(l) {
  const t = [l.nome, l.colecao, ...l.extras, ...l.pecas.map(c => BY[c] ? BY[c].nome + " " + BY[c].cor : "")].join(" ").toLowerCase();
  const m = new Set();
  if (/cetim|renda|veludo|total black|noite|tule|pérola|verniz|jantar|couro|leopardo|acetinada/.test(t)) m.add("noite");

}

// ---------- Gerador ----------
function pool(cat) { const all = PIECES.filter(p => p.cat === cat); const mine = all.filter(isMine); return state.onlyMine && mine.length ? mine : all.filter(p => p.tenho !== "desejo"); }
function generate(lockCode) {
  const lock = lockCode ? BY[lockCode] : null;
  let layer = lock?.cat === "terceira" ? lock : null;
  let bottom = isBottom(lock) ? lock : null;
  if (!bottom) { const o = [...pool("saia"), ...pool("calca")].filter(b => !(AMPLAS.includes(layer?.code) && COM_VOLUME.includes(b.code))); bottom = o.length ? pick(o) : null; }
  if (!layer && Math.random() < 0.5) { const o = pool("terceira").filter(l => !(COM_VOLUME.includes(bottom?.code) && AMPLAS.includes(l.code))); layer = o.length ? pick(o) : null; }
  let tops = pool("top").filter(t => (layer?.code !== "COL-01" || t.code.startsWith("CAM")) && !(COM_VOLUME.includes(bottom?.code) && AMPLAS.includes(t.code)));
  const top = lock?.cat === "top" ? lock : pick(tops.length ? tops : pool("top"));
  const out = [top, layer, bottom].filter(Boolean);
  const escuro = /preto|preta/.test(top.cor + (layer?.cor || ""));
  if (lock?.cat === "acessorio") out.push(lock);
  else if (!LONG.includes(layer?.code) && Math.random() < 0.4 && BY["ACE-02"]) out.push(BY[escuro ? "ACE-02" : "ACE-01"]);
  const codes = [...new Set(out.map(p => p.code))];
  if (lockCode && !codes.includes(lockCode)) codes.push(lockCode);

}
function promptFor(codes) {

  return `Foto vertical 2:3 no estilo de street style de modelo fora do trabalho, anos 90 minimalista, tirada de longe com lente 50 mm, luz natural de manhã, calçada de cidade com prédios claros desfocados ao fundo. Cores naturais, levemente quentes, granulado sutil de filme.
Uma mulher magra e esguia, 1,68 m, cerca de 56 kg, cintura fina e marcada, pernas longas e finas. Cabelo castanho acobreado (castanho médio com reflexos cobre, NÃO preto nem castanho escuro), puxado para trás num coque baixo liso, óculos escuros pequenos pretos. Andando na calçada naturalmente, corpo inteiro visível.
Ela veste exatamente:
${desc}${semBaixo(codes) ? "\n- " + BAIXO_GENERICO : ""}
- sapato simples e discreto, em tom neutro (não é o foco do look)
${codes.some(c => AMPLAS.includes(c)) ? "Só a peça oversized é larga, de propósito. Todas as outras peças são do tamanho certo do corpo magro dela, ajustadas na cintura.\n" : ""}Ocasião: trabalho em escritório.
Sem texto, sem logotipos. Roupas exatamente como descritas, sem estampas nem peças extras.`;
}
let gen = null;

    ${state.db ? `<button class="btn" type="button" data-save>＋ salvar ideia</button>` : ""}</div>`);
}
async function copy(text, preId = "promptText") {

  catch { const pre = $(preId); if (pre) { const d = pre.closest("details"); if (d) d.open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Texto selecionado: segure e copie"); }
}

// ---------- Banco ----------

// ---------- Navegação ----------
const TABS = ["mood","looks","favoritos","pecas"];
function route() {
  const tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "mood";
  TABS.forEach(t => $("view-" + t).hidden = t !== tab);
  document.querySelectorAll("nav.bar a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  scrollTo(0, 0);
  if (tab !== "looks" && state.sel) { state.sel = null; renderLooks(); }
  $("selbar").hidden = !state.sel || tab !== "looks";
}
addEventListener("hashchange", route);

document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el) return; const d = el.dataset;
  if ("close" in d) return sheet.close();
  if (d.mood) { state.mood = d.mood; resetOrder(); renderMoodChips(); return renderHero(); }
  if (d.mode) { state.mode = d.mode; try { localStorage.setItem("mode", d.mode); } catch {} resetOrder(); renderMoodChips(); return renderHero(); }
  if (el.id === "prev") return go(-1);
  if (el.id === "next") return go(1);
  if (el.id === "seeLook") { const l = current(); return l && showLook(l.id); }
  if (el.id === "drawNew") return showGenerated();
  if (el.id === "selToggle") { if (!state.db && !state.sel) return toast("Abra logada no claude.ai para remover looks"); state.sel = state.sel ? null : new Set(); return renderLooks(); }
  if (el.id === "selWish") {
    const ids = [...(state.sel || [])]; if (!ids.length) return; el.disabled = true;
    for (const id of ids) await setLook(id, { wishlist: true });
    state.sel = null; renderLooks(); renderFavs();
    return toast(`${ids.length} na wishlist (aba favoritos)`);
  }
  if (d.unwish) { await setLook(d.unwish, { wishlist: false }); renderFavs(); return toast("Tirado da wishlist"); }
  if (el.id === "selRemove") {
    const ids = [...(state.sel || [])]; if (!ids.length) return;
    el.disabled = true;
    for (const id of ids) await setLook(id, { oculto: true, ocultoEm: todayISO() });
    state.sel = null; resetOrder(); renderHero(); renderLooks(); renderFavs();
    return toast(`${ids.length} look${ids.length === 1 ? "" : "s"} removido${ids.length === 1 ? "" : "s"}`);
  }
  if (d.lmood) { state.looksMood = d.lmood; return renderLooks(); }
  if (d.lpiece) { state.lookPiece = state.lookPiece === d.lpiece ? null : d.lpiece; return renderLooks(); }
  if (d.cat) { state.cat = d.cat; return renderPieces(); }
  if (d.look) { if (state.sel) { state.sel.has(d.look) ? state.sel.delete(d.look) : state.sel.add(d.look); return renderLooks(); } return showLook(d.look); }
  if (d.piece) return showPiece(d.piece);
  if (d.gen) return showGenerated(d.gen);
  if ("regen" in d) return showGenerated(gen?.lockCode);
  if ("copy" in d) return copy(promptFor(gen.codes));
  if (d.copyprompt) return copy(PROMPTS[+d.copyprompt].texto, "pp-" + d.copyprompt);
  if (d.copycombo) return copy(promptFor(d.copycombo.split(",")));
  if ("save" in d) { try { await state.db.collection("ideias").add({ pecas: gen.codes, prompt: promptFor(gen.codes), criadoEm: todayISO(), status: "nova" }); toast("Ideia salva"); el.disabled = true; el.textContent = "✓ salva"; } catch { toast("Não consegui salvar a ideia."); } return; }
  if (d.fav) {
    if (!state.db) return toast("Abra logada no claude.ai para favoritar");
    await setLook(d.fav, { favorito: !isFav(d.fav) }); renderHero(); renderLooks(); renderFavs();

(() => {
