<style>
/* Layout: guarda-roupa como mural (masonry) + etiquetas de peça com código; ação de sortear sempre no topo */
:root {
  --bg: #F2F1EE;
  --surface: #FFFFFF;
  --fg: #1E1C1B;
  --muted: #6E6862;
  --line: #DEDAD4;
  --accent: #6B2C42;      /* vinho */
  --accent-soft: #F1E4E8;
  --on-accent: #FFFFFF;
  --star: #B8862E;
  --font-display: "Bodoni Moda", "Didot", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --surface: #211F1E; --fg: #EDE9E4; --muted: #A39C95; --line: #34312E;
    --accent: #D9A0B4; --accent-soft: #3A2830; --on-accent: #1A1214; --star: #E0B65E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --surface: #211F1E; --fg: #EDE9E4; --muted: #A39C95; --line: #34312E;
  --accent: #D9A0B4; --accent-soft: #3A2830; --on-accent: #1A1214; --star: #E0B65E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
.today { color: var(--muted); }

/* Sortear */
.draw { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.draw-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

/* Abas */
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--accent); }
.count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Mural (masonry) */
.board { columns: 4 200px; column-gap: 12px; }
.board.looks { columns: 5 170px; }
.sheet .board.looks { columns: 3 120px; }
.card { break-inside: avoid; margin-bottom: 12px; display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; padding: 0; position: relative; transition: transform .15s ease; }
.card:hover { transform: translateY(-2px); }
.card img { display: block; width: 100%; height: auto; }
.card .cap { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.card .name { font-weight: 500; line-height: 1.3; }
.card .look-name { font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.2; }
.tag { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.status { font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.status.wish { color: var(--star); border-color: var(--star); }
.status.ok { color: var(--accent); border-color: var(--accent); }
.fav-badge { position: absolute; top: 8px; right: 8px; background: var(--surface); color: var(--star); border-radius: 999px; width: 28px; height: 28px; display: grid; place-items: center; font-size: 15px; box-shadow: 0 1px 4px rgb(0 0 0 / .15); }

.empty { color: var(--muted); padding: 24px 0; }

/* Painel (dialog) */
dialog { border: none; padding: 0; background: var(--surface); color: var(--fg); border-radius: 14px; width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 32px); box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(20 18 17 / .55); }
.sheet { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet h2 { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 28px; line-height: 1.1; margin: 0; text-wrap: balance; }
.close { border: none; background: transparent; font-size: 26px; line-height: 1; padding: 2px 8px; color: var(--muted); }
.split { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 18px; }
@media (max-width: 560px) { .split { grid-template-columns: 1fr; } .split > img { max-width: 240px; } }
.split > img { width: 100%; border-radius: var(--radius); }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pieces-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 0; overflow: hidden; text-align: left; }
.mini img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; }
.mini span { display: block; padding: 5px 7px 7px; font-size: 12px; line-height: 1.25; }
.mini .mono { display: block; color: var(--muted); padding: 0; }
.mini.ghost { border-style: dashed; display: grid; align-content: end; min-height: 140px; color: var(--muted); }
.mini.locked { outline: 2px solid var(--accent); outline-offset: -2px; }
.prompt { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; max-height: 220px; overflow: auto; margin: 0; }
.note { font-size: 13px; color: var(--muted); }
.note.hit { color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.prompts { display: flex; flex-direction: column; gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pcard-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pcard-head > div { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.pcard h3 { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 20px; line-height: 1.2; margin: 0; min-width: 0; }
.pcard details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.pcard details .prompt { margin-top: 8px; }
.btn.copy { padding: 12px 22px; font-size: 16px; }
.idea .thumbs { display: flex; gap: 6px; overflow-x: auto; }
.idea .thumbs img { width: 58px; height: 72px; object-fit: cover; border-radius: 6px; flex: none; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

const isMine = p => p.tenho === true;
function combosFor(p) {
  const conflito = (a, b) => (AMPLAS.includes(a) && COM_VOLUME.includes(b)) || (AMPLAS.includes(b) && COM_VOLUME.includes(a));
  if (isBottom(p)) return PIECES.filter(t => t.cat === "top" && isMine(t) && !conflito(t.code, p.code)).map(t => [t.code, p.code]);
  if (p.cat === "top") return PIECES.filter(b => isBottom(b) && (isMine(b) || b.tenho === "desejo") && !conflito(p.code, b.code)).map(b => [p.code, b.code]);
  return [];
}

// ---------- Gerador ----------
const LONG = ["CAS-01","TRE-01","BLA-02"];
function pool(cat) {
  const all = PIECES.filter(p => p.cat === cat);
  const mine = all.filter(isMine);
  return state.onlyMine && mine.length ? mine : all;
}
// Proporção: peça ampla em cima pede parte de baixo reta/ajustada (nada de volume)
const AMPLAS = ["JAQ-02","BLU-14"];
const COM_VOLUME = ["SAI-01"];
const isBottom = p => p && ["saia","calca"].includes(p.cat);
function generate(lockCode) {
  const lock = lockCode ? BY[lockCode] : null;
  let layer = lock?.cat === "terceira" ? lock : null;
  let bottom = isBottom(lock) ? lock : null;
  if (!bottom) {
    const opts = [...pool("saia"), ...pool("calca")].filter(b => !(AMPLAS.includes(layer?.code) && COM_VOLUME.includes(b.code)));
    bottom = opts.length ? pick(opts) : null;
  }
  if (!layer && Math.random() < 0.55) {
    const opts = pool("terceira").filter(l => !(COM_VOLUME.includes(bottom?.code) && AMPLAS.includes(l.code)));
    layer = opts.length ? pick(opts) : null;
  }
  let top = lock?.cat === "top" ? lock : pick(pool("top").filter(t => layer?.code !== "COL-01" || t.code.startsWith("CAM")));
  if (layer?.code === "COL-01" && !top.code.startsWith("CAM") && lock?.cat === "top") layer = null;
  const out = [top, layer, bottom].filter(Boolean);
  const escuro = /preto|preta/.test(top.cor + (layer?.cor || ""));
  if (lock?.cat === "acessorio") out.push(lock);
  else if (!LONG.includes(layer?.code) && Math.random() < 0.45) out.push(BY[escuro ? "ACE-02" : "ACE-01"]);
  if (lock?.code !== "ACE-03" && Math.random() < 0.2) out.push(BY["ACE-03"]);
  const codes = [...new Set(out.map(p => p.code))];
  if (lockCode && !codes.includes(lockCode)) codes.push(lockCode);
  return codes;
}
const BAIXO_GENERICO = "calça reta de alfaiataria de cintura alta, em tom neutro, caimento ajustado e sem volume";
const semBaixo = codes => !codes.some(c => isBottom(BY[c]));
function promptFor(codes) {
  const desc = codes.map(c => { const p = BY[c]; return `- ${p.nome.toLowerCase()} ${p.cor} (${p.det})`; }).join("\n");
  return `Foto vertical 2:3 no estilo de street style de modelo fora do trabalho, anos 90 minimalista, tirada de longe com lente 50 mm, luz natural de manhã, calçada de cidade com prédios claros desfocados ao fundo. Cores naturais, levemente quentes, granulado sutil de filme.
Uma mulher magra e esguia, 1,68 m, cerca de 56 kg, cintura fina e marcada, pernas longas e finas. Cabelo castanho acobreado puxado para trás num coque baixo liso e polido, óculos escuros pequenos pretos. Andando na calçada naturalmente, corpo inteiro visível.
Ela veste exatamente:
${desc}${semBaixo(codes) ? "\n- " + BAIXO_GENERICO : ""}
- sapato simples e discreto, em tom neutro (não é o foco do look)
${codes.some(c => AMPLAS.includes(c)) ? "Só a peça oversized é larga, de propósito. Todas as outras peças são do tamanho certo do corpo magro dela, ajustadas na cintura; a blusa fica por dentro e a peça larga fica aberta.\n" : ""}Ocasião: trabalho em escritório.
Sem texto, sem logotipos. Roupas exatamente como descritas, sem estampas nem peças extras.`;
}
function sameLook(codes) {
  const key = s => [...s].filter(c => !c.startsWith("ACE")).sort().join();
  return LOOKS.find(l => key(l.pecas) === key(codes));
}
let current = null;
function showGenerated(lockCode) {
  const codes = generate(lockCode);
  current = { codes, lockCode };
  const hit = sameLook(codes);
  openSheet(`${head("Combinação nova", lockCode ? "Montado com " + lockCode : "Sorteio")}
    <div class="pieces-row">${codes.map(c => mini(c, c === lockCode)).join("")}${semBaixo(codes) ? `<div class="mini ghost"><span><span class="mono">A CADASTRAR</span>Calça reta, sem volume</span></div>` : ""}</div>
    ${semBaixo(codes) ? `<p class="note" style="margin:0">Essa peça é ampla e pede uma parte de baixo reta ou ajustada. Você ainda não tem nenhuma cadastrada, então o prompt sugere uma calça reta neutra.</p>` : ""}
    <p class="note ${hit ? "hit" : ""}" style="margin:0">${hit ? `Você já tem foto dessa combinação: “${esc(hit.nome)}”.` : "Ainda não tem foto dessa combinação. Copie o prompt e cole no ChatGPT para ver como fica."}</p>
    <div class="label">Prompt para o ChatGPT</div>
    <pre class="prompt" id="promptText">${esc(promptFor(codes))}</pre>
    <div class="actions">
      <button class="btn" type="button" data-regen>↻ Sortear de novo</button>
      <button class="btn primary" type="button" data-copy>Copiar prompt</button>
      ${state.db ? `<button class="btn" type="button" data-save>＋ Salvar ideia</button>` : ""}
    </div>`);
}
function showSavedDraw() {
  let list = LOOKS;
  // evita looks usados nos últimos 7 dias; favoritos têm peso dobrado
  const week = new Date(Date.now() - 7 * 864e5).toLocaleDateString("sv-SE");
  const fresh = list.filter(l => !(state.favs[l.id]?.usos || []).some(u => u >= week));
  const base = fresh.length ? fresh : list;
  const bag = [...base, ...base.filter(l => state.favs[l.id]?.favorito)];
  showLook(pick(bag).id);
}

function renderPrompts() {
  const list = [...PROMPTS].sort((a, b) => a.gerado - b.gerado);
  $("cPrompts").textContent = PROMPTS.filter(p => !p.gerado).length || "";
  $("promptsList").innerHTML = list.map((p, i) => `<div class="pcard">
    <div class="pcard-head"><div><h3>${esc(p.titulo)}</h3>
      <span class="status ${p.gerado ? "" : "ok"}">${p.gerado ? "já gerado" : "para gerar"}</span></div>
      <button class="btn primary copy" type="button" data-copyprompt="${PROMPTS.indexOf(p)}">Copiar</button></div>
    <details><summary>Ver o prompt</summary><pre class="prompt" id="pp-${PROMPTS.indexOf(p)}">${esc(p.texto)}</pre></details>
  </div>`).join("");
}
async function copy(text, preId = "promptText") {
  try { await navigator.clipboard.writeText(text); toast("Copiado! Agora é só colar no ChatGPT"); }
  catch {
    const pre = $(preId); if (pre) { const d = pre.closest("details"); if (d) d.open = true; }
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Selecionei o texto: copie com Ctrl+C / segurar e copiar");
  }
}

// ---------- Banco (favoritos, usos, ideias) ----------
async function setLook(id, patch) {
  const next = { ...(state.favs[id] || {}), ...patch };
  state.favs[id] = next;
  try { await state.db.doc(`looks/${id}`).set(next); } catch (e) { toast("Não consegui salvar. Tente de novo."); }
}
async function initDb() {
  let db = null;
  try { db = await window.claude?.use?.("db"); } catch {}
  if (!db) { renderIdeas(); return; }
  state.db = db;
  renderIdeas();
  db.collection("looks").onSnapshot(snap => {
    const favs = {}; snap.docs.forEach(d => favs[d.id] = d.data());
    state.favs = favs; renderLooks();
  }, () => {});
  db.collection("ideias").orderBy("criadoEm", "desc").onSnapshot(snap => {
    state.ideas = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderIdeas();
  }, () => {});
}

// ---------- Navegação ----------
function route() {
  const tab = ["prompts","looks","pecas","ideias"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "looks";
  for (const t of ["prompts","looks","pecas","ideias"]) $("view-" + t).hidden = t !== tab;
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
}
addEventListener("hashchange", route);

document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if ("close" in d) return sheet.close();
  if (d.f) { state.lookFilter = d.f; renderLookFilters(); renderLooks(); return; }
  if (d.cat) { state.cat = d.cat; renderCatFilters(); renderPieces(); return; }
  if (d.look) return showLook(d.look);
  if (d.piece) return showPiece(d.piece);
  if (d.gen) return showGenerated(d.gen);
  if ("regen" in d) return showGenerated(current?.lockCode);
  if ("copy" in d) return copy(promptFor(current.codes));
  if ("save" in d) {
    try { await state.db.collection("ideias").add({ pecas: current.codes, prompt: promptFor(current.codes), criadoEm: todayISO(), status: "nova" }); toast("Ideia salva"); el.disabled = true; el.textContent = "✓ Salva"; }
    catch { toast("Não consegui salvar a ideia."); }
    return;
  }
  if (d.fav) { await setLook(d.fav, { favorito: !state.favs[d.fav]?.favorito }); return showLook(d.fav); }
  if (d.used) { const u = [...(state.favs[d.used]?.usos || []), todayISO()].slice(-30); await setLook(d.used, { usos: u }); toast("Bom dia de trabalho ✦"); return showLook(d.used); }
  if (d.copyprompt) { const p = PROMPTS[+d.copyprompt]; return copy(p.texto, "pp-" + d.copyprompt); }
  if (d.copycombo) return copy(promptFor(d.copycombo.split(",")));
  if (d.copyidea) { const i = state.ideas.find(x => x.id === d.copyidea); return copy(i?.prompt || promptFor(i.pecas)); }
  if (d.delidea) { try { await state.db.doc(`ideias/${d.delidea}`).delete(); toast("Ideia removida"); } catch { toast("Não consegui remover."); } return; }
});
$("drawSaved").addEventListener("click", showSavedDraw);
$("drawNew").addEventListener("click", () => showGenerated());
$("onlyMine").addEventListener("change", e => { state.onlyMine = e.target.checked; try { localStorage.setItem("onlyMine", state.onlyMine ? "1" : "0"); } catch {} });
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

renderLookFilters(); renderLooks(); renderCatFilters(); renderPieces(); renderIdeas(); renderPrompts(); route(); initDb();
</script>
