<title>Looks do Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular — um look por vez sobre papel pontilhado, chips de mood no topo, barra preta fixa embaixo */
:root {
  --bg: #EBEAE7;
  --dot: transparent;
  --surface: #FFFFFF;
  --ink: #141414;
  --muted: #85847F;
  --line: #E4E3DF;
  --on-ink: #FFFFFF;
  --heart: #D6384B;
  --font: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --dot: #2C2C2A; --surface: #1C1C1B; --ink: #F1F0EC; --muted: #9A9993; --line: #2E2E2C; --on-ink: #121212; --heart: #F06A7A; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --dot: #2C2C2A; --surface: #1C1C1B; --ink: #F1F0EC; --muted: #9A9993; --line: #2E2E2C; --on-ink: #121212; --heart: #F06A7A; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--bg);
  color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-weight: 700; letter-spacing: -0.02em; margin: 0; text-transform: lowercase; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.05; text-align: center; }
h2 { font-size: 24px; line-height: 1.1; }
.sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.link { background: none; border: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: none; background: var(--surface); border-radius: 999px; padding: 8px 15px; font-size: 14px; font-weight: 500; box-shadow: 0 0 0 1px var(--line) inset; text-transform: lowercase; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }

/* hero */
.hero { position: relative; display: flex; justify-content: center; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.hero-img { -webkit-user-drag: none; }
.hero-img { width: min(100%, 380px); aspect-ratio: 4 / 5; object-fit: cover; object-position: center 30%; border-radius: 22px; display: block; background: transparent; will-change: transform; }
.controls { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 14px; }
.ctrl { width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--surface); display: grid; place-items: center; font-size: 30px; line-height: 1; padding-bottom: 3px; }
.ctrl.fav { width: 60px; height: 60px; background: var(--ink); color: var(--on-ink); font-size: 24px; }
.ctrl.fav.on { background: var(--heart); color: #fff; }
.round { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset, 0 4px 14px -6px rgb(0 0 0 / .25); display: grid; place-items: center; font-size: 20px; }
.round.left { left: 0; } .round.right { right: 0; }
.round.on { color: var(--heart); }
.hero-cap { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.hero-cap strong { font-size: 18px; text-transform: lowercase; }
.hero-cap span { color: var(--muted); font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }

/* segmentado */
.seg { align-self: center; display: inline-flex; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: 0 0 0 1px var(--line) inset; }
.seg button { border: none; background: none; border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

/* complete the look */
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; margin: 0 -2px; scroll-snap-type: x mandatory; }
.rail::-webkit-scrollbar { display: none; }
.pcard { flex: none; width: 132px; scroll-snap-align: start; background: var(--surface); border: none; border-radius: 18px; padding: 8px; text-align: left; box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; gap: 6px; }
.pcard img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; }
.pcard .ph { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
.pcard b { font-size: 13px; font-weight: 600; line-height: 1.25; }
.pcard small { color: var(--muted); font-size: 12px; }

/* grades */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { border: none; padding: 0; background: var(--surface); border-radius: 20px; overflow: hidden; text-align: left; box-shadow: 0 0 0 1px var(--line) inset; position: relative; display: flex; flex-direction: column; }
.tile img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: center 30%; display: block; }
.tile .t { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .t b { font-size: 14px; font-weight: 600; text-transform: lowercase; line-height: 1.25; }
.tile .t small { color: var(--muted); font-size: 12px; }
.tile .fav { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); color: var(--heart); display: grid; place-items: center; font-size: 14px; }
.tile.sel { box-shadow: 0 0 0 3px var(--ink) inset; }
.tile.sel img { opacity: .75; }
.tile .check { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgb(0 0 0 / .25); display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; }
.tile.sel .check { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 999px; padding: 6px 6px 6px 16px; box-shadow: 0 8px 30px -8px rgb(0 0 0 / .35), 0 0 0 1px var(--line) inset; white-space: nowrap; }
.btn.danger { background: #C8323F; color: #fff; box-shadow: none; }
.prail { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.prail::-webkit-scrollbar { display: none; }
.pf { flex: none; width: 58px; border: none; padding: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pf img { width: 58px; height: 58px; object-fit: cover; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
.pf span { font-size: 10px; color: var(--muted); line-height: 1.15; text-align: center; max-width: 58px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pf[aria-pressed="true"] img { box-shadow: 0 0 0 3px var(--ink); }
.pf[aria-pressed="true"] span { color: var(--ink); font-weight: 600; }
.badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.badge.ok { color: var(--ink); }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.toggle input { accent-color: var(--ink); width: 16px; height: 16px; }

/* botões */
.btn { border: none; border-radius: 999px; padding: 11px 18px; font-weight: 600; font-size: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.btn.dark { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.btn.small { padding: 7px 13px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* lista de prompts / ideias */
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.card details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.prompt { background: var(--bg); border-radius: 12px; padding: 12px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; max-height: 240px; overflow: auto; margin: 8px 0 0; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs img { width: 56px; height: 70px; object-fit: cover; border-radius: 8px; flex: none; }

/* barra inferior */
nav.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #0E0E0E; color: #F1F0EC;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  border-radius: 22px 22px 0 0; box-shadow: 0 -1px 0 var(--line); }
nav.bar .in { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; }
nav.bar a { color: #A8A7A2; text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 6px; text-transform: lowercase; }
nav.bar a[aria-current="page"] { color: #FFFFFF; text-decoration: underline; text-underline-offset: 5px; }

/* painel */
dialog { border: none; padding: 0; background: var(--surface); color: var(--ink); border-radius: 24px; width: min(560px, calc(100vw - 20px)); max-height: calc(100dvh - 28px); box-shadow: 0 24px 60px rgb(0 0 0 / .35); }
dialog::backdrop { background: rgb(10 10 10 / .5); }
.sheet { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.close { border: none; background: transparent; font-size: 26px; line-height: 1; padding: 2px 8px; color: var(--muted); }
.sheet .big { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 18px; background: var(--bg); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 50; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .hero-img { transition: opacity .2s ease; } }
</style>

<div class="wrap">
  <section id="view-mood">
    <div class="wrap" style="gap:16px">
      <h1>escolha seu mood</h1>
      <div class="chips" id="moodChips"></div>
      <div id="hero"></div>
      <div class="seg" role="group" aria-label="De onde vêm as peças">
        <button type="button" data-mode="mine">meu armário</button>
        <button type="button" data-mode="discover">descobrir</button>
      </div>
      <div>
        <div class="row"><h2>complete o look</h2><button class="link" type="button" id="seeLook">ver look</button></div>
        <p class="sub">as peças deste look</p>
      </div>
      <div class="rail" id="rail"></div>
    </div>
  </section>

  <section id="view-looks" hidden>
    <div class="wrap" style="gap:14px">
      <div class="row" style="position:sticky;top:0;z-index:20;background:var(--bg, #ecebe8);padding:10px 0;margin:-10px 0"><h2>looks</h2><div class="actions"><button class="btn small" type="button" id="selToggle">selecionar</button></div></div>
      <div class="seg" role="group" aria-label="Tipo de look"><button type="button" data-lmode="mine">só peças minhas</button><button type="button" data-lmode="sug">sugestões de compra</button></div>
      <div class="chips" id="looksChips"></div>
      <div class="prail" id="pieceFilter"></div>
      <p class="sub" id="pieceFilterInfo" style="margin:-6px 0 0" hidden></p>
      <div class="grid" id="looksGrid"></div>
    </div>
  </section>

  <section id="view-semana" hidden>
    <div class="wrap" style="gap:18px">
      <h1>look de hoje</h1>
      <p class="sub" id="semanaInfo"></p>
      <div id="semanaDias" style="display:flex;flex-direction:column;gap:22px"></div>
    </div>
  </section>
  <section id="view-favoritos" hidden>
    <div class="wrap" style="gap:14px">
      <h2>favoritos</h2>
      <div class="grid" id="favGrid"></div>
      <h2 style="margin-top:8px">wishlist</h2>
      <p class="sub" style="margin-top:-8px">looks que você quer montar e as peças que faltam</p>
      <div class="list" id="wishList"></div>
      <h2 style="margin-top:8px">ideias para gerar</h2>
      <div class="list" id="ideasList"></div>
    </div>
  </section>

  <section id="view-pecas" hidden>
    <div class="wrap" style="gap:14px">
      <h2>peças</h2>
      <div class="chips" id="catChips" style="flex-wrap:wrap;overflow:visible"></div>
      <label class="toggle" hidden><input type="checkbox" id="onlyMine"> sortear só com peças que eu tenho</label>
      <div class="grid" id="piecesGrid"></div>
    </div>
  </section>

</div>

const PROMPTS = /*PROMPTS*/[{"titulo": "Compras novas: casaco cinza, bota cano alto e camisa listrada (Zara)", "arquivo": "2026-11-09-compras-novas-zara.md", "gerado": false, "texto": "Crie uma única imagem com uma grade de 6 fotos (2 linhas × 3 colunas), separadas por finas linhas brancas, no estilo de fotos de street style de modelo fora do trabalho, minimalista e sofisticado, tiradas de longe com lente 50 mm, luz natural de manhã de inverno, calçada de cidade com prédios claros desfocados ao fundo. Cores naturais, levemente quentes, granulado sutil de filme.\n\nA MODELO (a mesma em todas as fotos): Mulher magra e esguia, 1,68 m, cerca de 56 kg, ombros estreitos, cintura fina, pernas longas. Cabelo castanho acobreado (castanho médio com reflexos cobre, NÃO preto nem castanho escuro). Rosto cortado na altura do nariz ou coberto pelos óculos. Andando na calçada, naturalmente, como se não soubesse que está sendo fotografada; corpo inteiro visível.\n\nPEÇAS NOVAS (descrever fielmente):\n(A) casaco LONGO até a canela CINZA MESCLA de sarja de lã fina, AJUSTADO com recortes, GOLA PADRE alta sem lapela, fileira de botões pretos pequenos, bolsos com lapela.\n(B) bota PRETA de cano alto reto até abaixo do joelho, couro liso, bico quadrado, salto alto bloco fino.\n(C) camisa BRANCA de algodão com listras finas em relevo branco sobre branco, gola de camisa, punho com botão.\n\nLOOKS (escritório, Curitiba):\n1. (A)+(B)+(C) por dentro de saia lápis preta de malha até o joelho; meia-calça fina preta; mini bolsa preta matelassê; coque baixo liso.\n2. (A)+(B) com suéter felpudo off-white de gola alta baixa e saia midi plissada preta; meia-calça fina preta; bolsa estruturada vinho.\n3. (A) aberto + (C) com calça cenoura terracota no tornozelo; sapato preto de bico com salto bloco; bolsa de mão caramelo croco.\n4. (C) por baixo de suéter de tricô fino camelo (gola e punhos da camisa aparecendo) + saia transpassada preta midi com fivela + (B); meia-calça fina; bolsa de ombro estrutur // ---------- Regras ----------
const LONG = ["CAS-01","TRE-01","BLA-02"];

const isBottom = p => p && ["saia","calca","vestido"].includes(p.cat);
const isMine = p => p && p.tenho === true;
const ACESS = /bolsa|óculos|cinto|colar|brinc|argola|lenço|pérola|tote|meia-calça/i;
const BAIXO_GENERICO = "calça reta de alfaiataria de cintura alta, em tom neutro, caimento ajustado e sem volume";
const semBaixo = codes => !codes.some(c => isBottom(BY[c]));

// ---------- Moods ----------
const MOODS = [["todos","todos"],["trabalho","trabalho"],["minimal","minimalista"],["offduty","off-duty"],["noite","noite"]];
function moodsOf(l) {
  const t = [l.nome, l.colecao, ...l.extras, ...l.pecas.map(c => BY[c] ? BY[c].nome + " " + BY[c].cor : "")].join(" ").toLowerCase();
  const m = new Set();
  if (/cetim|renda|veludo|total black|noite|tule|pérola|verniz|jantar|couro|leopardo|acetinada/.test(t)) m.add("noite");
  if (/jeans|bomber|cargo|bermuda|casual|baby tee|regata|tênis|palha|capri|crochê|linho|sexta|wingsuit/.test(t)) m.add("offduty");
  if (/blazer|alfaiataria|camisa|polo|colete|tweed|risca|lápis|siren|cigarrete|reunião|executivo|trench|pied|marinho|suéter/.test(t)) m.add("trabalho");
  if (/off-white|creme|cinza|monocrom|minimal|tom sobre tom|wingsuit|branca|bege|camelo/.test(t) || m.size === 0) m.add("minimal");
  return m;
}
const garmentExtras = l => l.extras.filter(x => !ACESS.test(x));
const lookIsMine = l => garmentExtras(l).length === 0 && l.pecas.every(c => isMine(BY[c]) || BY[c]?.cat === "acessorio" || (!BY[c] && c.startsWith("SAP-")));
LOOKS.forEach(l => { l.moods = moodsOf(l); l.mine = lookIsMine(l); });

// ---------- Estado ----------
const state = { mood: "todos", mode: "mine", order: [], pos: 0, looksMood: "todos", cat: "todas", favs: {}, pfav: {}, ideas: [], db: null, onlyMine: true };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

// ---------- Mood (tela principal) ----------
function moodList() {

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function resetOrder() {

// ---------- Peças ----------
const CAT_LIST = () => ["todas", ...Object.keys(CATS).filter(c => PIECES.some(p => p.cat === c))];
const status = p => p.tenho === "exercicio" ? `<span class="badge">só exercício</span>` : p.tenho === true ? `<span class="badge ok">tenho</span>` : p.tenho === "desejo" ? `<span class="badge">quero comprar</span>` : `<span class="badge">a confirmar</span>`;

function combosFor(p) {
  const conflito = (a, b) => (AMPLAS.includes(a) && COM_VOLUME.includes(b)) || (AMPLAS.includes(b) && COM_VOLUME.includes(a));
  if (isBottom(p)) return PIECES.filter(t => t.cat === "top" && isMine(t) && !conflito(t.code, p.code)).map(t => [t.code, p.code]);
  if (p.cat === "top") return PIECES.filter(b => isBottom(b) && (isMine(b) || b.tenho === "desejo") && !conflito(p.code, b.code)).map(b => [p.code, b.code]);
  return [];
}
function showPiece(code) {

      <div>${c.map(x => esc(BY[x].nome + " " + BY[x].cor)).join(" + ")}</div><div class="actions"><button class="btn small dark" type="button" data-copycombo="${c.join(",")}">copiar prompt</button></div></div>`).join("")}</div>` : ""}`);
}

// ---------- Gerador ----------
function pool(cat) { const all = PIECES.filter(p => p.cat === cat); const mine = all.filter(isMine); return state.onlyMine && mine.length ? mine : all.filter(p => p.tenho !== "desejo"); }
function generate(lockCode) {
  const lock = lockCode ? BY[lockCode] : null;
  let layer = lock?.cat === "terceira" ? lock : null;
  let bottom = isBottom(lock) ? lock : null;
  if (!bottom) { const o = [...pool("saia"), ...pool("calca")].filter(b => !(AMPLAS.includes(layer?.code) && COM_VOLUME.includes(b.code))); bottom = o.length ? pick(o) : null; }
  if (!layer && Math.random() < 0.5) { const o = pool("terceira").filter(l => !(COM_VOLUME.includes(bottom?.code) && AMPLAS.includes(l.code))); layer = o.length ? pick(o) : null; }
  let tops = pool("top").filter(t => (layer?.code !== "COL-01" || t.code.startsWith("CAM")) && !(COM_VOLUME.includes(bottom?.code) && AMPLAS.includes(t.code)));
  const top = lock?.cat === "top" ? lock : pick(tops.length ? tops : pool("top"));
  const out = [top, layer, bottom].filter(Boolean);
  const escuro = /preto|preta/.test(top.cor + (layer?.cor || ""));
  if (lock?.cat === "acessorio") out.push(lock);
  else if (!LONG.includes(layer?.code) && Math.random() < 0.4 && BY["ACE-02"]) out.push(BY[escuro ? "ACE-02" : "ACE-01"]);
  const codes = [...new Set(out.map(p => p.code))];
  if (lockCode && !codes.includes(lockCode)) codes.push(lockCode);
  return codes;
}
function promptFor(codes) {
  const desc = codes.map(c => { const p = BY[c]; return `- ${p.nome.toLowerCase()} ${p.cor} (${p.det})`; }).join("\n");
  return `Foto vertical 2:3 no estilo de street style de modelo fora do trabalho, anos 90 minimalista, tirada de longe com lente 50 mm, luz natural de manhã, calçada de cidade com prédios claros desfocados ao fundo. Cores naturais, levemente quentes, granulado sutil de filme.
Uma mulher magra e esguia, 1,68 m, cerca de 56 kg, cintura fina e marcada, pernas longas e finas. Cabelo castanho acobreado (castanho médio com reflexos cobre, NÃO preto nem castanho escuro), puxado para trás num coque baixo liso, óculos escuros pequenos pretos. Andando na calçada naturalmente, corpo inteiro visível.
Ela veste exatamente:
${desc}${semBaixo(codes) ? "\n- " + BAIXO_GENERICO : ""}

  const o = semOpt(id); const d = o.dia; const escolhido = (state.escolhas || {})[d.iso] === id;
  openSheet(`${head(o.nome, d.dia + " · " + d.max + "°/" + d.min + "°" + (d.chuva ? " · chuva" : ""))}<img class="big" src="${o.img}" alt="">

    ${state.db ? `<div class="actions"><button class="btn dark" type="button" data-wpick="${id}">${escolhido ? "✓ escolhido para " + d.dia : "escolher para " + d.dia}</button><button class="btn" type="button" data-wusei="${id}">${((state.favs[o.lookId || id] || {}).usos || []).includes(todayISO()) ? "✓ usei hoje" : "👗 usei hoje"}</button><button class="btn" type="button" data-wtroca="${id}">✕ não gostei, trocar</button></div>` : ""}`);
}

// ---------- Banco ----------
async function setLook(id, patch) {
  state.favs[id] = { ...(state.favs[id] || {}), ...patch };
  try { await state.db.doc(`looks/${id}`).set(state.favs[id]); } catch { toast("Não consegui salvar. Tente de novo."); }
}
async function setPeca(code) {
  const v = !state.pfav[code]?.favorito;
  state.pfav[code] = { ...(state.pfav[code] || {}), favorito: v, em: todayISO() };
  try { await state.db.doc(`pecas/${code}`).set(state.pfav[code]); } catch { toast("Não consegui salvar. Tente de novo."); }
}
async function initDb() {
  let db = null; try { db = await window.claude?.use?.("db"); } catch {}
  if (!db) { renderFavs(); return; }
  state.db = db; renderFavs();
  db.collection("looks").onSnapshot(snap => { const f = {}; snap.docs.forEach(d => f[d.id] = d.data()); state.favs = f; renderHero(); renderLooks(); renderFavs(); }, () => {});
  db.doc("semana/" + SEMANA.inicio).onSnapshot(snap => { const sd = (snap && snap.exists && snap.data()) || {}; state.escolhas = sd.escolhas || {}; state.trocas = sd.trocas || {}; state.excluidos = sd.excluidos || []; renderSemana(); }, () => {});
  db.doc("clima/atual").onSnapshot(snap => { state.clima = (snap && snap.exists && snap.data()) || null; renderSemana(); }, () => {});
  db.collection("pecas").onSnapshot(snap => { const f = {}; snap.docs.forEach(d => f[d.id] = d.data()); state.pfav = f; renderPieces(); }, () => {});
  db.collection("ideias").orderBy("criadoEm", "desc").onSnapshot(snap => { state.ideas = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderFavs(); }, () => {});
}

// ---------- Navegação ----------
const TABS = ["mood","looks","semana","favoritos","pecas"];
function route() {
  const tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "mood";
  TABS.forEach(t => $("view-" + t).hidden = t !== tab);
  document.querySelectorAll("nav.bar a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  scrollTo(0, 0);
  if (tab !== "looks" && state.sel) { state.sel = null; renderLooks(); }
  $("selbar").hidden = !state.sel || tab !== "looks";
}
addEventListener("hashchange", route);

document.addEventListener("click", async e => {
  const el = e.target.closest("button"); if (!el) return; const d = el.dataset;
  if ("close" in d) return sheet.close();
  if (d.mood) { state.mood = d.mood; resetOrder(); renderMoodChips(); return renderHero(); }
  if (d.mode) { state.mode = d.mode; try { localStorage.setItem("mode", d.mode); } catch {} resetOrder(); renderMoodChips(); return renderHero(); }
  if (el.id === "prev") return go(-1);
  if (el.id === "next") return go(1);
  if (el.id === "seeLook") { const l = current(); return l && showLook(l.id); }
  if (el.id === "drawNew") return showGenerated();
  if (el.id === "selToggle") { if (!state.db && !state.sel) return toast("Abra logada no claude.ai para remover looks"); state.sel = state.sel ? null : new Set(); return renderLooks(); }
  if (el.id === "selWish") {
    const ids = [...(state.sel || [])]; if (!ids.length) return; el.disabled = true;
    for (const id of ids) await setLook(id, { wishlist: true });
    state.sel = null; renderLooks(); renderFavs();
    return toast(`${ids.length} na wishlist (aba favoritos)`);
  }
  if (d.regen) return regenLook(d.regen, el);
  if (d.regenfoto) { const g = state.regen; if (!g) return; try { await state.db.collection("pedidos").add({ tipo: "regerar", substitui: g.de, nome: g.nome || "", pecas: g.pecas, criadoEm: todayISO(), status: "novo" }); el.disabled = true; el.textContent = "✓ pedido salvo"; toast("Pedido salvo: me fale “gera os pedidos” no chat"); } catch { toast("Não consegui salvar"); } return; }
  if (d.wopt) return showWOpt(d.wopt);
  if (d.wusei) {
    if (!state.db) return toast("Abra logada no claude.ai para marcar");
    const o = semOpt(d.wusei); const key = o.lookId || d.wusei; const u = (state.favs[key] || {}).usos || [];
    if (!u.includes(todayISO())) await setLook(key, { usos: [...u, todayISO()] });
    showWOpt(d.wusei); return toast("Marcado como usado hoje");
  }
  if (d.wtroca) {
    const atual = semOpt(d.wtroca); const novo = pickReplacement(d.wtroca);
    if (!novo) return toast("Não achei outro look para esse clima");
    state.excluidos = [...new Set([...(state.excluidos || []), atual.lookId || SEM_OPC[d.wtroca].reusa || d.wtroca])];
    const lookVelho = atual.lookId || SEM_OPC[d.wtroca].reusa;
    if (lookVelho && state.db) await setLook(lookVelho, { oculto: true, ocultoEm: todayISO() });
    state.trocas = { ...(state.trocas || {}), [d.wtroca]: novo.id };
    if (state.escolhas && state.escolhas[atual.dia.iso] === d.wtroca) delete state.escolhas[atual.dia.iso];
    try { await state.db.doc("semana/" + SEMANA.inicio).set({ escolhas: state.escolhas || {}, trocas: state.trocas, excluidos: state.excluidos }); } catch {}
    renderSemana(); showWOpt(d.wtroca); return toast("Removido e trocado");
  }
  if (d.wpick) { const o = SEM_OPC[d.wpick]; state.escolhas = { ...(state.escolhas || {}), [o.dia.iso]: d.wpick }; try { await state.db.doc("semana/" + SEMANA.inicio).set({ escolhas: state.escolhas, trocas: state.trocas || {}, excluidos: state.excluidos || [] }); } catch {} renderSemana(); showWOpt(d.wpick); return toast("Escolhido para " + o.dia.dia); }
  if (el.id === "weekBtn") return openWeek();
  if (el.id === "weekGo") return buildWeek(el);
  if (el.id === "pfMark") { if (!state.db) return toast("Abra logada no claude.ai para favoritar"); state.pfMark = !state.pfMark; if (state.pfMark) state.cat = "todas"; return renderPieces(); }
  if (d.pfav) { await setPeca(d.pfav); return showPiece(d.pfav); }
  if (d.piece && state.pfMark) { await setPeca(d.piece); return renderPieces(); }
  if (d.hide) {
    if (!state.db) return toast("Abra logada no claude.ai para remover looks");
    await setLook(d.hide, { oculto: true, ocultoEm: todayISO() });
    state.order = state.order.filter(id => id !== d.hide);
    if (state.pos >= state.order.length) state.pos = 0;
    renderHero(); renderLooks(); renderFavs();
    return toast("Look removido");
  }
  if (d.unwish) { await setLook(d.unwish, { wishlist: false }); renderFavs(); return toast("Tirado da wishlist"); }
  if (el.id === "selRemove") {
    const ids = [...(state.sel || [])]; if (!ids.length) return;
    el.disabled = true;
    for (const id of ids) await setLook(id, { oculto: true, ocultoEm: todayISO() });
    state.sel = null; resetOrder(); renderHero(); renderLooks(); renderFavs();
    return toast(`${ids.length} look${ids.length === 1 ? "" : "s"} removido${ids.length === 1 ? "" : "s"}`);
  }
  if (d.lmode) { state.looksMode = d.lmode; state.lookPiece = null; return renderLooks(); }
  if (d.lmood) { state.looksMood = d.lmood; return renderLooks(); }
  if (d.lpiece) { state.lookPiece = state.lookPiece === d.lpiece ? null : d.lpiece; return renderLooks(); }
  if (d.cat) { state.cat = d.cat; return renderPieces(); }
  if (d.look) { if (state.sel) { state.sel.has(d.look) ? state.sel.delete(d.look) : state.sel.add(d.look); return renderLooks(); } return showLook(d.look); }
  if (d.piece) return showPiece(d.piece);
  if (d.gen) return showGenerated(d.gen);
  if ("regen" in d) return showGenerated(gen?.lockCode);
  if ("copy" in d) return copy(promptFor(gen.codes));
  if (d.copyprompt) return copy(PROMPTS[+d.copyprompt].texto, "pp-" + d.copyprompt);
  if (d.copycombo) return copy(promptFor(d.copycombo.split(",")));
  if ("save" in d) { try { await state.db.collection("ideias").add({ pecas: gen.codes, prompt: promptFor(gen.codes), criadoEm: todayISO(), status: "nova" }); toast("Ideia salva"); el.disabled = true; el.textContent = "✓ salva"; } catch { toast("Não consegui salvar a ideia."); } return; }
  if (d.fav) {
    if (!state.db) return toast("Abra logada no claude.ai para favoritar");
    await setLook(d.fav, { favorito: !isFav(d.fav) }); renderHero(); renderLooks(); renderFavs();
    return sheet.open ? showLook(d.fav) : null;
  }
  if (d.used) { await setLook(d.used, { usos: [...(state.favs[d.used]?.usos || []), todayISO()].slice(-30) }); toast("Bom dia de trabalho ✦"); return showLook(d.used); }
  if (d.copyidea) { const i = state.ideas.find(x => x.id === d.copyidea); return copy(i?.prompt || promptFor(i.pecas)); }
  if (d.delidea) { try { await state.db.doc(`ideias/${d.delidea}`).delete(); toast("Ideia removida"); } catch { toast("Não consegui remover."); } return; }
});
// Arrastar a foto: para a esquerda avança, para a direita volta
const preloaded = new Set();
function preloadAround() {
  const n = state.order.length; if (!n) return;
  for (const k of [1, -1, 2]) { const l = LOOKS.find(x => x.id === state.order[(state.pos + k + n) % n]); if (l && !preloaded.has(l.img)) { const im = new Image(); im.src = l.img; preloaded.add(l.img); } }
}
function go(step) {
  const n = Math.max(1, state.order.length); const i = document.querySelector(".hero-img");
  const nextPos = (state.pos + step + n) % n; const l = LOOKS.find(x => x.id === state.order[nextPos]);
  const swap = () => { state.pos = nextPos; renderHero();
    const ni = document.querySelector(".hero-img"); if (!ni) return;
    ni.style.transition = "none"; ni.style.transform = `translateX(${step * 40}px)`; ni.style.opacity = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => { ni.style.transition = "transform .22s ease, opacity .22s ease"; ni.style.transform = ""; ni.style.opacity = ""; }));
  };
  if (!i || !l) return swap();
  i.style.transition = "transform .18s ease, opacity .18s ease";
  i.style.transform = `translateX(${-step * 120}%) rotate(${-step * 6}deg)`; i.style.opacity = "0";
  const pre = new Image(); let done = false; const fin = () => { if (!done) { done = true; swap(); } };
  pre.onload = pre.onerror = () => setTimeout(fin, 120); pre.src = l.img; setTimeout(fin, 900);
}
(() => {
  const h = $("hero"); let x0 = null, y0 = 0, dx = 0, horiz = null;
  const img = () => h.querySelector(".hero-img");
  const start = (x, y) => { if (!img()) return; x0 = x; y0 = y; dx = 0; horiz = null; };
  const move = (x, y, ev) => {
    if (x0 === null) return; dx = x - x0; const dy = y - y0;
    if (horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(dx) > Math.abs(dy);
    if (!horiz) return; if (ev && ev.cancelable) ev.preventDefault();
    const i = img(); i.style.transition = "none"; i.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
  };
  const end = () => {
    if (x0 === null) return; x0 = null; const i = img();
    if (horiz && Math.abs(dx) > 50) return go(dx < 0 ? 1 : -1);
    if (i) { i.style.transition = "transform .2s ease"; i.style.transform = ""; }
  };
  h.addEventListener("touchstart", e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  h.addEventListener("touchmove", e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
  h.addEventListener("touchend", end); h.addEventListener("touchcancel", end);
  h.addEventListener("mousedown", e => { e.preventDefault(); start(e.clientX, e.clientY); });
  addEventListener("mousemove", e => move(e.clientX, e.clientY)); addEventListener("mouseup", end);
})();
$("onlyMine").addEventListener("change", e => { state.onlyMine = e.target.checked; try { localStorage.setItem("onlyMine", state.onlyMine ? "1" : "0"); } catch {} });
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

resetOrder(); renderMoodChips(); renderHero(); renderLooks(); renderFavs(); renderPieces(); renderSemana(); route(); initDb();
</script>
